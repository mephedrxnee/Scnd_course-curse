[tool.poetry]
name = "airplane-tracker"
version = "0.1.0"
description = "Coursework: Airplane tracker"
authors = ["Your Name"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
flake8 = "^7.0.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."